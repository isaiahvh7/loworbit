name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild + redeploy every 4 hours so the baked-in TLE data (and the
    # site the TV is loading) stays fresh even with no code changes.
    # TLEs themselves don't need to be this fresh, but a kiosk tab left
    # open for days only ever sees new data via these rebuilds.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4